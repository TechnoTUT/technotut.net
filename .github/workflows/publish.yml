name: Publish to Cloudflare Workers

on: [push, workflow_dispatch]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.actor, '[bot]') && github.repository == 'TechnoTUT/technotut.net' }}
    permissions:
      contents: read
      deployments: write
    name: Publish to Cloudflare Workers
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/cache@v3
        id: node_modules_cache_id
        env:
          cache-name: cache-node-modules
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
      - run: echo '${{ toJSON(steps.node_modules_cache_id.outputs) }}'
      - if: ${{ steps.node_modules_cache_id.outputs.cache-hit != 'true' }}
        run: npm install
      - name: export
        run: npm run export
      - name: build worker
        run: npm run build
      # main -> production Worker ("technotut", custom domain)
      - name: Deploy to production
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # Other branches -> upload a new version of the same Worker without promoting it.
      # Production keeps serving the current deployment; the version gets its own preview URL.
      - name: Upload preview version
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload
